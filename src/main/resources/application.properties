spring.application.name=TabularAI
spring.config.import=optional:file:.env[.properties]

# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/tabularai
spring.datasource.username=postgres
spring.datasource.password=postgres_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Límite para subida de archivos CSV (5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Integración con IA (Groq vía API compatible con OpenAI)
spring.ai.openai.api-key=${GROQ_API_KEY:dummy-key}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.2
